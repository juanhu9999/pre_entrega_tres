{% extends "entrega/base.html" %}

{% block main %}
  <h2>Sign up</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
  </form>

  <h2>Login</h2>
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ login_form.as_p }}
    <button type="submit">Login</button>
  </form>
{% endblock %}
